server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Cabeceras Location relativas: detrás de un túnel o proxy el esquema y el puerto públicos no son los de aquí.
    absolute_redirect off;
    # Los vídeos se suben al servicio de vídeo en trozos de 16 MB (Videos:ChunkSizeMb); las fotos y escudos, hasta unos pocos MB.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml application/wasm;

    # Los contenedores de la API y del servicio de vídeo (repositorio TercerTiempo-Back) entran en la red
    # tercer-tiempo-net como "api" y "videos". Se resuelven en cada petición, así que este contenedor arranca aunque
    # todavía no estén en marcha.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tercer_tiempo_api http://api:8080;
    set $tercer_tiempo_videos http://videos:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api { return 404; }
    location = /media { return 404; }

    location ^~ /api/ {
        proxy_pass $tercer_tiempo_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # La sincronización manual de /jobs puede tardar.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Servicio de vídeo (contenedor "videos" del backend): reproducción y descarga por rangos (206) sin almacenarlas
    # en el proxy; un partido entero son horas de peticiones.
    location ~ ^/media/videos/.+/(stream|download)$ {
        proxy_pass $tercer_tiempo_videos$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Subida por trozos de 16 MB: cada trozo pasa directo al servicio, sin guardarlo antes en el disco del proxy.
    location ^~ /media/ {
        proxy_pass $tercer_tiempo_videos$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Ficheros con hash en el nombre: inmutables.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Modelos, texturas y motores WASM (MediaPipe, Plyr): estables, pero sin hash en el nombre.
    location ~ ^/(models|textures|vendor)/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
        # El HTML siempre fresco: apunta a los ficheros de la última versión.
        add_header Cache-Control "no-cache" always;
    }
}
